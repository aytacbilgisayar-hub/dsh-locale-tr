name: Publish to npm

# npm Trusted Publishing (OIDC) ile yayınlar — NPM_TOKEN secret'ı GEREKMEZ.
# Çalışması için npm'de paketin "Trusted Publisher" ayarında bu repo + bu iş
# akışı dosyası (publish.yml) tanımlı olmalıdır.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # OIDC için şart
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest   # OIDC trusted publishing icin npm >= 11.5.1
      - run: npm publish --access public
